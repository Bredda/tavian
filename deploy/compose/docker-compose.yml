# Tavian demo stack: the gateway in front of a mock OpenAI-compatible backend,
# with PostgreSQL recording usage events.
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#
# The backend lives on an `internal` network: it has no route to the Internet,
# which is the property Tavian is built around. The gateway also joins a normal
# network only so that Docker can publish its port to the host; it still
# refuses every connection that is not a configured backend (egress guard).
# In production, enforce this with network policies / firewall rules too.
#
# Passwords and keys in this file and in keycloak/ are for this demo only.
name: tavian-demo

x-database-url: &database-url
  TAVIAN_DATABASE_URL: postgres://tavian:tavian-demo@postgres:5432/tavian?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tavian
      POSTGRES_PASSWORD: tavian-demo
      POSTGRES_DB: tavian
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavian -d tavian"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Reference identity provider (ADR-0002); Tavian only needs standard OIDC.
  # Realm "tavian": users alice (group ai-research) and bob (no group),
  # password = user name. Dev mode, demo only.
  #
  # The browser-facing URL (http://localhost:8081) is what ends up in the tokens'
  # issuer; the gateway fetches the signing keys over the internal network.
  # Keycloak joins `publish` only so that its port can be published on the host;
  # a real deployment runs the IdP elsewhere.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/tavian-realm.json:/opt/keycloak/data/import/tavian-realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks: [backplane, publish]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/tavian HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  # One-shot: applies the database migrations, then exits.
  migrate:
    build:
      context: ../..
      args: { CMD: tavian }
    image: tavian:dev
    command: ["migrate"]
    environment: *database-url
    volumes:
      - ./tavian.yaml:/etc/tavian/tavian.yaml:ro
    networks: [backplane]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  tavian:
    build:
      context: ../..
      args: { CMD: tavian }
    image: tavian:dev
    command: ["serve"]
    environment: *database-url
    volumes:
      - ./tavian.yaml:/etc/tavian/tavian.yaml:ro
      - spool:/var/lib/tavian/spool
    ports:
      - "127.0.0.1:8080:8080" # data plane (OpenAI-compatible API)
      - "127.0.0.1:9090:9090" # admin: /healthz /readyz /metrics
    networks: [backplane, publish]
    depends_on:
      mockllm: { condition: service_started }
      mockllm-external: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  mockllm:
    build:
      context: ../..
      args: { CMD: mockllm }
    image: tavian-mockllm:dev
    command: ["-addr", ":8000", "-name", "on-prem"]
    networks: [backplane]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Stands for an approved external provider (see partner-eu in tavian.yaml).
  # It sits on the private network too, so the demo never leaves your machine.
  mockllm-external:
    build:
      context: ../..
      args: { CMD: mockllm }
    image: tavian-mockllm:dev
    command: ["-addr", ":8000", "-name", "partner-eu"]
    networks: [backplane]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata: {}
  spool: {}

networks:
  backplane:
    internal: true # no Internet access
  publish: {}
