name: Docker Hub login
description: >-
  Sign in to Docker Hub so that image pulls count against our account instead of
  the anonymous rate limit of the runner's address. Without credentials (pull
  requests from forks do not get the secret) it does nothing and pulls stay
  anonymous.
inputs:
  username:
    description: Docker Hub user (the DOCKER_HUB_USER variable)
    required: false
    default: ""
  token:
    description: Read-only access token (the DOCKER_HUB_TOKEN secret)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: ${{ inputs.username != '' && inputs.token != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}
