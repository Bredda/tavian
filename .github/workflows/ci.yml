name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs are squash-merged: the PR title becomes the commit on main, and
  # release-please derives versions and changelog from it.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must not start with an uppercase letter.

  # Developer Certificate of Origin (ADR-0014): every commit of the pull request
  # is signed off. Dependabot and release-please make commits without anyone to
  # certify them; they are exempt when the pull request comes from a branch of
  # this repository (a fork cannot claim the exemption).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the sign-off of every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FROM_FORK" = false ] && { [ "$AUTHOR" = "dependabot[bot]" ] || [[ "$HEAD_REF" == release-please--* ]]; }; then
            echo "Pull request made by tooling: exempt"
            exit 0
          fi
          scripts/check-dco.sh "$BASE" "$HEAD"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        # Empty without the secret (forks): the pull is then anonymous.
        credentials:
          username: ${{ secrets.DOCKER_HUB_TOKEN && vars.DOCKER_HUB_USER || '' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tavian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Enables the PostgreSQL integration tests (internal/store).
      TAVIAN_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/tavian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      # On its own, after the rest: it compiles the gateway, which would make
      # the timing-sensitive tests above flaky if they ran at the same time.
      - name: Demo scenario on the binaries (e2e)
        run: go test -tags e2e -race -count=1 ./e2e

  # The official OpenAI Python and Node SDKs against a real gateway in front of
  # the mock backend (conformance/README.md).
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: SDK conformance
        run: conformance/run.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build (all packages)
        run: go build ./...
      - name: Cross-compile the gateway
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/tavian
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build images (not pushed)
        run: |
          docker build --build-arg CMD=tavian -t tavian:ci .
          docker build --build-arg CMD=mockllm -t tavian-mockllm:ci .

  # The scenario of docs/VISION.md against the demo stack as it ships: real images,
  # volumes, read-only file systems and key permissions (scripts/demo-e2e.sh).
  # The same scenario runs against the binaries in the test job (e2e/).
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Demo scenario (docker compose)
        run: scripts/demo-e2e.sh

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
