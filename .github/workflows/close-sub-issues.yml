name: Close sub-issues

# When a pull request is merged, GitHub closes the issues it names with
# `Closes #n`. The sub-issues of those issues (the tasks of a main issue) are
# closed here, and the Project's "Item closed" automation moves them to Done.
#
# pull_request_target runs the workflow of the default branch with a token that
# can write issues, also for pull requests from forks. That is safe because
# nothing of the pull request is checked out or executed: only its number is
# used, and the issues it closes are read from GitHub.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-sub-issues:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Close the sub-issues of the issues this pull request closes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mapfile -t issues < <(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
          scripts/close-sub-issues.sh "$PR" "${issues[@]}"
