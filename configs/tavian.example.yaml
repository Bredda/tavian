# Annotated example configuration. Unknown keys are rejected on purpose.
# Validate with:  tavian validate -config tavian.yaml
# Reload with:    kill -HUP <pid>   (invalid configs are rejected, the current one stays active)

# Required. Which kinds of backend may exist, and therefore whether the gateway
# may open any outbound connection beyond your own network:
#   air-gapped         only `internal` backends
#   controlled-egress  `internal` + `approved-external`
#   open-egress        any
# Changing the profile requires a restart.
profile: air-gapped

listen:
  data: ":8080"                # OpenAI-compatible API
  admin: "127.0.0.1:9090"      # /healthz /readyz /metrics: keep it private

limits:
  max_request_bytes: 4194304   # 4 MiB
  max_inflight: 256            # API requests handled at once (a stream counts until it ends); beyond it: 503 + Retry-After
  upstream_header_timeout: 120s
  shutdown_grace: 30s

log:
  level: info                  # debug | info | warn | error
  format: json                 # json | text

# Sign-in with an OIDC provider (Keycloak, Entra ID, Okta, Authentik, Dex, ...):
# applications and people present the provider's access token as a bearer
# token, next to Tavian API keys. Tokens are verified locally against the
# provider's signing keys, which Tavian fetches through the egress guard and
# caches. Everything except `mappings` needs a restart to change.
# oidc:
#   issuer: https://idp.example.org/realms/tavian   # the tokens' "iss", exactly
#   audience: tavian                                # required: tokens for other apps are refused
#   destination_class: internal                     # how the egress guard treats the provider
#   # jwks_uri: https://idp.internal/keys           # skip discovery (<issuer>/.well-known/openid-configuration)
#   # jwks_refresh: 10m
#   # jwks_max_staleness: 24h     # how long cached keys stay trusted while the provider is unreachable
#   # clock_skew: 1m
#   # algorithms: [RS256, PS256, ES256]             # asymmetric only
#   claims:
#     groups: groups              # a dotted path works: realm_access.roles
#     application: azp
#   mappings:                     # groups -> team and models. No match: signed in, but no model.
#     - group: ai-research        # (first matching mapping names the team; models add up)
#       team: research
#       allowed_models: ["llama-*"]
#       # max_classification: internal  # clearance of this group (default internal); the highest of a person's groups applies

# Content inspection looks for sensitive data in everything a request carries,
# before anything leaves the gateway: e-mail addresses, IBANs, payment cards,
# French NIR, phone numbers, IPv4 addresses, API keys and tokens, password
# assignments, plus your own dictionaries and patterns. It is on by default and
# observes only: findings (never the matched text) are counted in the usage
# event and in metrics. It fails closed: a request that cannot be inspected
# completely (a detector error, going over the budget, images or other non-text
# parts) is refused, never served uninspected. Reloadable. See docs/INSPECTION.md.
# inspection:
#   enabled: true
#   budget: 50ms                         # for the whole request
#   # Secret for the fingerprints of findings (>= 16 bytes). Without it a random
#   # key is generated at startup, so fingerprints only correlate within one run.
#   fingerprint_key_env: TAVIAN_FINGERPRINT_KEY
#   disable: [pii.ip]                    # built-in detectors that are too noisy for your data
#   dictionaries:
#     - name: codenames                  # the finding subtype; the detector is custom.codenames
#       severity: high                   # low | medium (default) | high | critical
#       terms: ["Projet Aurore", "Falcon"]
#     - name: markings
#       terms: ["CONFIDENTIEL", "DIFFUSION RESTREINTE"]
#   patterns:
#     - name: contract-ref
#       regex: 'CTR-\d{6}'               # RE2 syntax

# Policies: YAML files that take models and destinations away from teams and
# applications, set their default label, and give labels to what you detect.
# They can only narrow what the built-in baseline allows. One or more policies
# per file; a relative path is relative to this file. Reloadable. Examples in
# configs/policies/; check them with `tavian validate` and test them with
# `tavian policy test`. A policy with `metadata.mode: shadow` enforces nothing and
# records what it would have done. See docs/POLICY.md.
# policy:
#   dir: policies

# Decision records are linked into a hash chain by a background worker, and the chain
# is sealed with Ed25519 signatures so that rewriting history is detectable. See
# docs/AUDIT.md. Make the key with `tavian audit-keygen -out audit.key`; without it the
# chain is built but nothing anchors it. Needs a database; changing it needs a restart.
# audit:
#   signing_key_file: /etc/tavian/audit.key
#   seal_every_events: 1000
#   seal_every: 5m
# workers:             # the consumers of the outbox
#   poll_interval: 1s
#   batch_size: 500

# How long events stay in the database. Usage events are summed by the hour first
# (usage_hourly), so their totals outlive them. Decision records are never removed
# unless decision_days is set, and then only once a signed seal covers them. 0 keeps
# for ever. See docs/AUDIT.md. Changing it needs a restart.
# outbox:
#   retention:
#     usage_days: 90
#     decision_days: 0
#   prune_every: 1h

# Quotas are set in policies (spec.quotas). This only tunes how tokens are
# reserved: a request that sets no max_tokens is assumed to need this many
# tokens for its answer. What the answer really holds is counted when it ends,
# even above it. Counters are in memory and start from zero on restart.
# quota:
#   default_output_tokens: 1024

# API reference (Scalar) at /docs and the OpenAPI description at /openapi.yaml,
# served on the data port without authentication. Both are embedded in the
# binary and work offline. They describe the API only. Default: enabled.
# docs:
#   enabled: false

# PostgreSQL records usage events (transactional outbox) and every configuration
# revision. Without this section the gateway only logs events: development only.
# Create the schema with:  tavian migrate -config tavian.yaml
# Changing this section requires a restart.
# database:
#   url_env: TAVIAN_DATABASE_URL          # e.g. postgres://tavian:...@db:5432/tavian?sslmode=verify-full
#                                         # the host must resolve to an internal address (see egress.internal_cidrs)
#                                         # and be reached over TCP: unix sockets are refused
#   spool_dir: /var/lib/tavian/spool      # holds events while PostgreSQL is down: use persistent storage
#   spool_max_bytes: 67108864             # when full and PostgreSQL is still down, requests get 503
#   emit_timeout: 2s

# What counts as "internal" for the egress guard. Defaults: loopback, RFC 1918,
# link-local, IPv6 ULA. Internal backends (and all backends when air-gapped)
# must resolve inside these ranges.
# egress:
#   internal_cidrs: ["10.0.0.0/8"]

# Carbon intensity of the electricity where backends run, in gCO2e per kWh. Enter
# your own figures: nothing is fetched from outside. A backend's `region` picks one;
# `default_g_per_kwh` applies to the others. Without an intensity a request has an
# energy estimate but no carbon figure.
# carbon:
#   default_g_per_kwh: 300
#   regions: { fr-paris: 55, de-frankfurt: 350 }

backends:
  - id: vllm-a
    type: openai                          # OpenAI-compatible: vLLM, llama.cpp, ...
    # region: fr-paris                    # where it runs: see carbon.regions
    base_url: http://vllm-a.internal:8000/v1
    destination_class: internal           # internal | approved-external | public-external
    max_classification: restricted        # most sensitive label it may receive (default depends on class)
    # api_key_env: VLLM_A_API_KEY         # credential read from this environment variable

  # Only valid with profile controlled-egress or open-egress:
  # - id: azure-eu
  #   type: openai
  #   base_url: https://my-resource.openai.azure.com/openai/v1
  #   destination_class: approved-external
  #   api_key_env: AZURE_OPENAI_API_KEY

models:
  - name: llama-70b                       # the name clients request
    type: chat
    route:
      - backend: vllm-a
        upstream_model: meta-llama/Llama-3.3-70B-Instruct   # defaults to the model name
        # Optional. Without a price a request has no cost (and uses no budget_eur
        # quota); without an energy profile it has no energy and no carbon.
        # price:                          # EUR per million tokens
        #   input: 0.50
        #   output: 1.50
        #   cached_input: 0.10            # default: the input price
        # energy:                         # an ESTIMATE, always labelled as one
        #   wh_per_1k_input_tokens: 0.3
        #   wh_per_1k_output_tokens: 1.2
        #   method: estimated             # estimated | benchmark | measured
        #   confidence: low               # low | medium | high

# The administration API (docs/ADMIN_API.md) is served on listen.admin once a
# token is listed, and needs the database. `tavian keygen -admin` makes one;
# the id names the author of every change in the audit trail.
# admin:
#   tokens:
#     - id: ops-alice
#       role: admin             # admin, operator or auditor: see docs/ADMIN_API.md
#       hash: sha256:REPLACE_WITH_OUTPUT_OF_tavian_keygen_-admin

api_keys:
  - id: research-app
    hash: sha256:REPLACE_WITH_OUTPUT_OF_tavian_keygen
    team: research
    application: notebook
    allowed_models: ["llama-*"]           # '*' wildcard; an empty list is invalid
    # expires_at: 2027-03-01              # refused from that instant (RFC 3339 or a date = 00:00 UTC); see docs/API_KEYS.md
    # max_classification: internal        # most sensitive data label this app may send (default internal)
